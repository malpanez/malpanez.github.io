name: CI/CD - Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read
  pages: write
  id-token: write

jobs:
  # Job 1: HTML Validation with W3C Validator
  validate-html:
    name: 🌐 Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: W3C HTML Validator
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          css: true
          extra: --ignore-re 'Attribute .* not allowed'

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache npm
        uses: actions/cache@v4.2.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML semantics
        run: |
          find . -name "*.html" -not -path "./node_modules/*" | while read file; do
            echo "Validating $file..."
            html-validate "$file" || true
          done

  # Job 2: CSS Validation & Linting
  validate-css:
    name: 🎨 Validate & Lint CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4.2.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-stylelint-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-stylelint-

      - name: Install stylelint
        run: npm install -g stylelint stylelint-config-standard

      - name: Lint CSS files
        run: |
          find . -name "*.css" -not -name "*.min.css" -not -path "./node_modules/*" | while read file; do
            echo "Linting $file..."
            stylelint "$file"
          done

  # Job 3: JavaScript Linting with ESLint
  lint-javascript:
    name: 📜 Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4.2.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-eslint-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Install ESLint
        run: npm install -g eslint@latest

      - name: Create ESLint config
        run: |
          cat > eslint.config.js << 'EOF'
          export default [
            {
              languageOptions: {
                ecmaVersion: 2024,
                sourceType: "module",
                globals: {
                  window: "readonly",
                  document: "readonly",
                  navigator: "readonly",
                  localStorage: "readonly",
                  console: "readonly",
                  setTimeout: "readonly",
                  clearTimeout: "readonly",
                  setInterval: "readonly",
                  IntersectionObserver: "readonly",
                  fetch: "readonly",
                  URL: "readonly",
                  location: "readonly",
                  performance: "readonly",
                  Request: "readonly",
                  Response: "readonly",
                  Headers: "readonly",
                  caches: "readonly",
                  self: "readonly",
                  clients: "readonly",
                  addEventListener: "readonly",
                  importScripts: "readonly"
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-console": "off",
                "no-undef": "error"
              }
            }
          ];
          EOF

      - name: Lint JavaScript files
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -not -name "*.min.js" | while read file; do
            echo "Linting $file..."
            eslint "$file"
          done

  # Job 4: Modern Link Checker
  check-links:
    name: 🔗 Check Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          args: --verbose --no-progress --exclude-all-private --exclude 'amazon.com|leanpub.com|calendly.com|tally.so|blog.homelabforge.dev|ansible-collection-security|webpagetest.org' '**/*.html' '**/*.md'
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 5: Lighthouse CI (Performance, Accessibility, SEO)
  lighthouse:
    name: ⚡ Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4.2.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-lhci-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lhci-

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@latest

      - name: Install http-server
        run: npm install -g http-server

      - name: Start local server
        run: |
          http-server -p 8080 > /dev/null 2>&1 &
          sleep 5
          curl -f http://localhost:8080 || (echo "Server failed to start" && exit 1)

      - name: Run Lighthouse CI
        run: |
          lhci autorun --config=.github/lighthouserc.json
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4.5.0
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30
          compression-level: 9

      - name: Format lighthouse score
        run: |
          if [ -f .lighthouseci/lhr-*.json ]; then
            echo "## ⚡ Lighthouse Scores" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for file in .lighthouseci/lhr-*.json; do
              PERFORMANCE=$(jq -r '.categories.performance.score * 100' "$file" 2>/dev/null || echo "N/A")
              ACCESSIBILITY=$(jq -r '.categories.accessibility.score * 100' "$file" 2>/dev/null || echo "N/A")
              BEST_PRACTICES=$(jq -r '.categories["best-practices"].score * 100' "$file" 2>/dev/null || echo "N/A")
              SEO=$(jq -r '.categories.seo.score * 100' "$file" 2>/dev/null || echo "N/A")
              echo "- **Performance:** ${PERFORMANCE}%" >> $GITHUB_STEP_SUMMARY
              echo "- **Accessibility:** ${ACCESSIBILITY}%" >> $GITHUB_STEP_SUMMARY
              echo "- **Best Practices:** ${BEST_PRACTICES}%" >> $GITHUB_STEP_SUMMARY
              echo "- **SEO:** ${SEO}%" >> $GITHUB_STEP_SUMMARY
              break
            done
          fi

  # Job 6: Accessibility with axe-core
  accessibility:
    name: ♿ Accessibility Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Install http-server
        run: npm install -g http-server

      - name: Start local server
        run: |
          http-server -p 8080 > /dev/null 2>&1 &
          sleep 5

      - name: Run axe accessibility tests
        run: |
          axe http://localhost:8080 --stdout --exit || true
          axe http://localhost:8080/books/advanced-pam-course.html --stdout --exit || true

  # Job 7: Security Scan with Trivy
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3.27.9
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()

  # Job 8: Advanced SEO Check
  seo-check:
    name: 🔍 SEO Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Check robots.txt
        run: |
          if [ ! -f robots.txt ]; then
            echo "::error::robots.txt is missing"
            exit 1
          fi
          echo "✅ robots.txt exists"
          cat robots.txt

      - name: Validate sitemap.xml
        run: |
          if [ ! -f sitemap.xml ]; then
            echo "::error::sitemap.xml is missing"
            exit 1
          fi
          xmllint --noout sitemap.xml && echo "✅ sitemap.xml is valid XML"
          xmllint --format sitemap.xml | head -50

      - name: Check required meta tags
        run: |
          echo "## 🔍 SEO Meta Tags Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for file in index.html books/advanced-pam-course.html; do
            if [ -f "$file" ]; then
              echo "### 📄 $file" >> $GITHUB_STEP_SUMMARY
              grep -q '<meta name="description"' "$file" && echo "✅ Description meta tag" >> $GITHUB_STEP_SUMMARY || echo "❌ Missing description" >> $GITHUB_STEP_SUMMARY
              grep -q '<meta property="og:title"' "$file" && echo "✅ Open Graph title" >> $GITHUB_STEP_SUMMARY || echo "⚠️  Missing OG title" >> $GITHUB_STEP_SUMMARY
              grep -q '<meta property="og:image"' "$file" && echo "✅ Open Graph image" >> $GITHUB_STEP_SUMMARY || echo "⚠️  Missing OG image" >> $GITHUB_STEP_SUMMARY
              grep -q '<link rel="canonical"' "$file" && echo "✅ Canonical URL" >> $GITHUB_STEP_SUMMARY || echo "⚠️  Missing canonical" >> $GITHUB_STEP_SUMMARY
              grep -q 'application/ld+json' "$file" && echo "✅ Schema.org JSON-LD" >> $GITHUB_STEP_SUMMARY || echo "⚠️  Missing structured data" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # Job 9: File Size & Performance Budget
  performance-budget:
    name: 📊 Performance Budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Check file sizes and report
        run: |
          echo "## 📊 File Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📄 HTML Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "*.html" -not -path "./node_modules/*" -exec du -h {} \; | sort -h >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🎨 CSS Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "*.css" -not -path "./node_modules/*" -exec du -h {} \; | sort -h >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📜 JavaScript Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "*.js" -not -path "./node_modules/*" -not -name "*.min.js" -exec du -h {} \; | sort -h >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check against budget
          echo "### ⚠️  Budget Warnings" >> $GITHUB_STEP_SUMMARY
          find . -name "*.html" -size +100k -exec echo "::warning file={}::HTML file exceeds 100KB" \;
          find . -name "*.css" -size +50k -exec echo "::warning file={}::CSS file exceeds 50KB" \;
          find . -name "*.js" -not -name "*.min.js" -size +30k -exec echo "::warning file={}::JS file exceeds 30KB" \;

  # Job 10: Markdown Linting
  lint-markdown:
    name: 📝 Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v18.0.0
        with:
          globs: '**/*.md'
        continue-on-error: true

  # Job 11: Spell Check
  spell-check:
    name: 📖 Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Check spelling
        uses: rojopolis/spellcheck-github-actions@0.46.0
        with:
          config_path: .github/spellcheck-config.yml
        continue-on-error: true

  # Job 12: Dependency Review (for PRs)
  dependency-review:
    name: 🔐 Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@v4.5.0
        with:
          fail-on-severity: high

  # Job 13: Generate Compliance Report
  compliance-report:
    name: 📋 Compliance Report
    runs-on: ubuntu-latest
    needs: [validate-html, validate-css, lint-javascript, lighthouse, accessibility, security-scan, seo-check]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Generate compliance summary
        run: |
          echo "# 🏆 Quality & Compliance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ✅ Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| HTML Validation | ${{ needs.validate-html.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CSS Validation | ${{ needs.validate-css.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript Linting | ${{ needs.lint-javascript.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse Audit | ${{ needs.lighthouse.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | ${{ needs.accessibility.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SEO Validation | ${{ needs.seo-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Pipeline completed!** Check individual job results above." >> $GITHUB_STEP_SUMMARY

  # Job 14: Deploy to GitHub Pages (only on main branch, after all checks pass)
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [validate-html, validate-css, lint-javascript, check-links, lighthouse, accessibility, security-scan, seo-check, lint-markdown, spell-check, performance-budget]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Post deployment summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Website URL:** https://homelabforge.dev" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed from:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All quality checks passed before deployment!" >> $GITHUB_STEP_SUMMARY
