name: CI/CD - Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Job 1: Linting (HTML, CSS, JS)
  lint:
    name: 🧪 Lint Code
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint

  # Job 2: Modern Link Checker
  check-links:
    name: 🔗 Check Links
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build

      # lychee >= 0.24 resolves root-relative links in local files, so the built
      # site is checked: the source HTML points at .min.css files only the build creates.
      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --exclude-all-private --root-dir ${{ github.workspace }}/dist --fallback-extensions html --exclude-path node_modules --exclude 'amazon.com|leanpub.com|calendly.com|tally.so|blog.homelabforge.dev|webpagetest.org' 'dist/**/*.html' '**/*.md'
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Lighthouse CI (Performance, Accessibility via axe-core, Best Practices, SEO)
  lighthouse:
    name: ⚡ Lighthouse Audit (Perf, A11y, SEO)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build

      - name: Start local server
        run: |
          npm run start:dist > /dev/null 2>&1 &
          curl -sf --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080 -o /dev/null || (echo "Server failed to start" && exit 1)

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: .github/lighthouserc.json
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ hashFiles('.lighthouseci/**') != '' }}
        with:
          name: lighthouse-results
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 30
          compression-level: 9

      - name: Format lighthouse score
        run: |
          if compgen -G '.lighthouseci/lhr-*.json' > /dev/null; then
            echo "## ⚡ Lighthouse Scores" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for file in .lighthouseci/lhr-*.json; do
              PERFORMANCE=$(jq -r '.categories.performance.score * 100' "$file" 2>/dev/null || echo "N/A")
              ACCESSIBILITY=$(jq -r '.categories.accessibility.score * 100' "$file" 2>/dev/null || echo "N/A")
              BEST_PRACTICES=$(jq -r '.categories["best-practices"].score * 100' "$file" 2>/dev/null || echo "N/A")
              SEO=$(jq -r '.categories.seo.score * 100' "$file" 2>/dev/null || echo "N/A")
              echo "- **Performance:** ${PERFORMANCE}%" >> $GITHUB_STEP_SUMMARY
              echo "- **Accessibility:** ${ACCESSIBILITY}%" >> $GITHUB_STEP_SUMMARY
              echo "- **Best Practices:** ${BEST_PRACTICES}%" >> $GITHUB_STEP_SUMMARY
              echo "- **SEO:** ${SEO}%" >> $GITHUB_STEP_SUMMARY
              break
            done
          fi

  # Accessibility is covered by the Lighthouse job: its `categories:accessibility`
  # assertion (minScore 0.93) runs the same axe-core ruleset across every URL in
  # .github/lighthouserc.json. Removed the standalone @axe-core/cli job, which
  # pulled an unmaintained selenium-webdriver dependency chain.

  # Job 4: Security Scan with Grype
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Grype security scanner
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          path: '.'
          output-format: 'sarif'
          fail-build: false

      - name: Upload Grype results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
        if: always()

  # Job 6: Advanced SEO Check
  seo-check:
    name: 🔍 SEO Validation
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check robots.txt
        run: |
          if [ ! -f robots.txt ]; then
            echo "::error::robots.txt is missing"
            exit 1
          fi
          echo "✅ robots.txt exists"
          cat robots.txt

      - name: Validate sitemap.xml
        run: |
          if [ ! -f sitemap.xml ]; then
            echo "::error::sitemap.xml is missing"
            exit 1
          fi
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')" && echo "✅ sitemap.xml is valid XML"
          head -50 sitemap.xml

      - name: Check required meta tags
        run: |
          echo "## 🔍 SEO Meta Tags Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for file in index.html books/advanced-pam-course.html; do
            if [ -f "$file" ]; then
              echo "### 📄 $file" >> $GITHUB_STEP_SUMMARY
              grep -q '<meta name="description"' "$file" && echo "✅ Description meta tag" >> $GITHUB_STEP_SUMMARY || echo "❌ Missing description" >> $GITHUB_STEP_SUMMARY
              grep -q '<meta property="og:title"' "$file" && echo "✅ Open Graph title" >> $GITHUB_STEP_SUMMARY || echo "⚠️  Missing OG title" >> $GITHUB_STEP_SUMMARY
              grep -q '<meta property="og:image"' "$file" && echo "✅ Open Graph image" >> $GITHUB_STEP_SUMMARY || echo "⚠️  Missing OG image" >> $GITHUB_STEP_SUMMARY
              grep -q '<link rel="canonical"' "$file" && echo "✅ Canonical URL" >> $GITHUB_STEP_SUMMARY || echo "⚠️  Missing canonical" >> $GITHUB_STEP_SUMMARY
              grep -q 'application/ld+json' "$file" && echo "✅ Schema.org JSON-LD" >> $GITHUB_STEP_SUMMARY || echo "⚠️  Missing structured data" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # Job 7: File Size & Performance Budget
  performance-budget:
    name: 📊 Performance Budget
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check file sizes and report
        run: |
          echo "## 📊 File Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📄 HTML Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "*.html" -not -path "./node_modules/*" -exec du -h {} \; | sort -h >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🎨 CSS Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "*.css" -not -path "./node_modules/*" -exec du -h {} \; | sort -h >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📜 JavaScript Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "*.js" -not -path "./node_modules/*" -not -name "*.min.js" -exec du -h {} \; | sort -h >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check against budget
          echo "### ⚠️  Budget Warnings" >> $GITHUB_STEP_SUMMARY
          find . -name "*.html" -size +100k -exec echo "::warning file={}::HTML file exceeds 100KB" \;
          find . -name "*.css" -size +50k -exec echo "::warning file={}::CSS file exceeds 50KB" \;
          find . -name "*.js" -not -name "*.min.js" -size +30k -exec echo "::warning file={}::JS file exceeds 30KB" \;

  # Job 8: Markdown Linting
  lint-markdown:
    name: 📝 Lint Markdown
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'

  # Job 9: Spell Check
  spell-check:
    name: 📖 Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check spelling
        uses: rojopolis/spellcheck-github-actions@f2df388397bcb35f524b4a0a3567d6b1e8a4e595 # 0.68.0
        with:
          config_path: .github/spellcheck-config.yml

  # Job 10: Dependency Review (for PRs)
  dependency-review:
    name: 🔐 Dependency Review
    runs-on: ubuntu-slim
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Job 11: Generate Compliance Report
  compliance-report:
    name: 📋 Compliance Report
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: [lint, lighthouse, security-scan, seo-check]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate compliance summary
        run: |
          echo "# 🏆 Quality & Compliance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ✅ Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linting | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse Audit (incl. a11y) | ${{ needs.lighthouse.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SEO Validation | ${{ needs.seo-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Pipeline completed!** Check individual job results above." >> $GITHUB_STEP_SUMMARY

  # Job 12: Deploy to GitHub Pages (only on main branch, after all checks pass)
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, check-links, lighthouse, security-scan, seo-check, lint-markdown, spell-check, performance-budget]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # Cloudflare keeps HTML for an hour; without a purge the cached pages keep
      # pointing at the previous build's content-hashed CSS/JS, which no longer exist.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ZONE_ID}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ZONE_ID variable not set: cached HTML may reference missing assets for up to an hour"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H @<(printf 'Authorization: Bearer %s\n' "${CLOUDFLARE_API_TOKEN}") \
            -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}' | jq -e '.success' > /dev/null
          echo "Cloudflare cache purged"

      - name: Post deployment summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Website URL:** https://homelabforge.dev" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed from:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All quality checks passed before deployment!" >> $GITHUB_STEP_SUMMARY
