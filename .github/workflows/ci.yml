name: CI/CD - Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Job 1: Linting (HTML, CSS, JS)
  lint:
    name: 🧪 Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linters
        run: npm run lint

  # Job 2: Modern Link Checker
  check-links:
    name: 🔗 Check Links
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2.7.0
        with:
          args: --verbose --no-progress --exclude-all-private --exclude 'amazon.com|leanpub.com|calendly.com|tally.so|blog.homelabforge.dev|webpagetest.org' '**/*.html' '**/*.md'
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Lighthouse CI (Performance, Accessibility, SEO)
  lighthouse:
    name: ⚡ Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build static assets
        run: npm run build

      - name: Start local server
        run: |
          npm run start:dist > /dev/null 2>&1 &
          curl -sf --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080 -o /dev/null || (echo "Server failed to start" && exit 1)

      - name: Run Lighthouse CI
        run: |
          npx lhci autorun --config=.github/lighthouserc.json
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ hashFiles('.lighthouseci/**') != '' }}
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30
          compression-level: 9

      - name: Format lighthouse score
        run: |
          if [ -f .lighthouseci/lhr-*.json ]; then
            echo "## ⚡ Lighthouse Scores" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for file in .lighthouseci/lhr-*.json; do
              PERFORMANCE=$(jq -r '.categories.performance.score * 100' "$file" 2>/dev/null || echo "N/A")
              ACCESSIBILITY=$(jq -r '.categories.accessibility.score * 100' "$file" 2>/dev/null || echo "N/A")
              BEST_PRACTICES=$(jq -r '.categories["best-practices"].score * 100' "$file" 2>/dev/null || echo "N/A")
              SEO=$(jq -r '.categories.seo.score * 100' "$file" 2>/dev/null || echo "N/A")
              echo "- **Performance:** ${PERFORMANCE}%" >> $GITHUB_STEP_SUMMARY
              echo "- **Accessibility:** ${ACCESSIBILITY}%" >> $GITHUB_STEP_SUMMARY
              echo "- **Best Practices:** ${BEST_PRACTICES}%" >> $GITHUB_STEP_SUMMARY
              echo "- **SEO:** ${SEO}%" >> $GITHUB_STEP_SUMMARY
              break
            done
          fi

  # Job 4: Accessibility with axe-core
  accessibility:
    name: ♿ Accessibility Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build static assets
        run: npm run build

      - name: Start local server
        run: |
          npm run start:dist > /dev/null 2>&1 &
          curl -sf --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080 -o /dev/null || (echo "Server failed to start" && exit 1)

      - name: Sync Chrome and ChromeDriver versions
        run: npx browser-driver-manager install chrome

      - name: Run axe accessibility tests
        run: |
          npx axe http://localhost:8080 --stdout --exit
          npx axe http://localhost:8080/books/advanced-pam-course.html --stdout --exit

  # Job 5: Security Scan with Grype
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Grype security scanner
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          path: '.'
          output-format: 'sarif'
          fail-build: false

      - name: Upload Grype results to GitHub Security
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
        if: always()

  # Job 6: Advanced SEO Check
  seo-check:
    name: 🔍 SEO Validation
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check robots.txt
        run: |
          if [ ! -f robots.txt ]; then
            echo "::error::robots.txt is missing"
            exit 1
          fi
          echo "✅ robots.txt exists"
          cat robots.txt

      - name: Validate sitemap.xml
        run: |
          if [ ! -f sitemap.xml ]; then
            echo "::error::sitemap.xml is missing"
            exit 1
          fi
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')" && echo "✅ sitemap.xml is valid XML"
          head -50 sitemap.xml

      - name: Check required meta tags
        run: |
          echo "## 🔍 SEO Meta Tags Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for file in index.html books/advanced-pam-course.html; do
            if [ -f "$file" ]; then
              echo "### 📄 $file" >> $GITHUB_STEP_SUMMARY
              grep -q '<meta name="description"' "$file" && echo "✅ Description meta tag" >> $GITHUB_STEP_SUMMARY || echo "❌ Missing description" >> $GITHUB_STEP_SUMMARY
              grep -q '<meta property="og:title"' "$file" && echo "✅ Open Graph title" >> $GITHUB_STEP_SUMMARY || echo "⚠️  Missing OG title" >> $GITHUB_STEP_SUMMARY
              grep -q '<meta property="og:image"' "$file" && echo "✅ Open Graph image" >> $GITHUB_STEP_SUMMARY || echo "⚠️  Missing OG image" >> $GITHUB_STEP_SUMMARY
              grep -q '<link rel="canonical"' "$file" && echo "✅ Canonical URL" >> $GITHUB_STEP_SUMMARY || echo "⚠️  Missing canonical" >> $GITHUB_STEP_SUMMARY
              grep -q 'application/ld+json' "$file" && echo "✅ Schema.org JSON-LD" >> $GITHUB_STEP_SUMMARY || echo "⚠️  Missing structured data" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # Job 7: File Size & Performance Budget
  performance-budget:
    name: 📊 Performance Budget
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check file sizes and report
        run: |
          echo "## 📊 File Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📄 HTML Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "*.html" -not -path "./node_modules/*" -exec du -h {} \; | sort -h >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🎨 CSS Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "*.css" -not -path "./node_modules/*" -exec du -h {} \; | sort -h >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📜 JavaScript Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "*.js" -not -path "./node_modules/*" -not -name "*.min.js" -exec du -h {} \; | sort -h >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check against budget
          echo "### ⚠️  Budget Warnings" >> $GITHUB_STEP_SUMMARY
          find . -name "*.html" -size +100k -exec echo "::warning file={}::HTML file exceeds 100KB" \;
          find . -name "*.css" -size +50k -exec echo "::warning file={}::CSS file exceeds 50KB" \;
          find . -name "*.js" -not -name "*.min.js" -size +30k -exec echo "::warning file={}::JS file exceeds 30KB" \;

  # Job 8: Markdown Linting
  lint-markdown:
    name: 📝 Lint Markdown
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@eb5ca3ab411449c66620fe7f1b3c9e10547144b0 # v18
        with:
          globs: '**/*.md'

  # Job 9: Spell Check
  spell-check:
    name: 📖 Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check spelling
        uses: rojopolis/spellcheck-github-actions@e7d2b8d65030d75d79a50c069a6ef30522e534eb # 0.46.0
        with:
          config_path: .github/spellcheck-config.yml

  # Job 10: Dependency Review (for PRs)
  dependency-review:
    name: 🔐 Dependency Review
    runs-on: ubuntu-slim
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  # Job 11: Generate Compliance Report
  compliance-report:
    name: 📋 Compliance Report
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: [lint, lighthouse, accessibility, security-scan, seo-check]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Generate compliance summary
        run: |
          echo "# 🏆 Quality & Compliance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ✅ Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linting | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse Audit | ${{ needs.lighthouse.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | ${{ needs.accessibility.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SEO Validation | ${{ needs.seo-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Pipeline completed!** Check individual job results above." >> $GITHUB_STEP_SUMMARY

  # Job 12: Deploy to GitHub Pages (only on main branch, after all checks pass)
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, check-links, lighthouse, accessibility, security-scan, seo-check, lint-markdown, spell-check, performance-budget]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build static assets
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Post deployment summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Website URL:** https://homelabforge.dev" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed from:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All quality checks passed before deployment!" >> $GITHUB_STEP_SUMMARY
