matrix:
- name: Markdown
  aspell:
    lang: en
    dictionaries:
    - es
  dictionary:
    encoding: utf-8
  pipeline:
  - pyspelling.filters.markdown:
  - pyspelling.filters.html:
      comments: false
      ignores:
      - code
      - pre
  sources:
  - '**/*.md'
  default_encoding: utf-8

- name: HTML
  aspell:
    lang: en
    dictionaries:
    - es
  dictionary:
    encoding: utf-8
  pipeline:
  - pyspelling.filters.html:
      comments: false
      ignores:
      - script
      - style
      - code
      - pre
  sources:
  - '**/*.html'
  default_encoding: utf-8

# Custom dictionary words
wordlists:
- .github/wordlist.txt
