matrix:
- name: Markdown
  sources:
  - '**/*.md'
  default_encoding: utf-8
  pipeline:
  - pyspelling.filters.markdown:
  - pyspelling.filters.html:
      comments: false
      ignores:
      - code
      - pre
  dictionary:
    wordlists:
    - .github/wordlist.txt
    encoding: utf-8
  aspell:
    lang: en

- name: HTML
  sources:
  - '**/*.html'
  default_encoding: utf-8
  pipeline:
  - pyspelling.filters.html:
      comments: false
      ignores:
      - script
      - style
      - code
      - pre
  dictionary:
    wordlists:
    - .github/wordlist.txt
    encoding: utf-8
  aspell:
    lang: en
