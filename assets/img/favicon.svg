<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB84D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9900;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#88CCF1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A9FD8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circuit paths - subtle background -->
  <g opacity="0.3" stroke="#4A9FD8" stroke-width="3" fill="none">
    <path d="M 200,140 L 200,180 L 256,180"/>
    <path d="M 312,140 L 312,180 L 256,180"/>
    <path d="M 256,180 L 256,250"/>
    <path d="M 180,220 L 220,220 L 220,280"/>
    <path d="M 332,220 L 292,220 L 292,280"/>
  </g>

  <!-- Circuit nodes -->
  <circle cx="200" cy="140" r="8" fill="#88CCF1" opacity="0.8"/>
  <circle cx="312" cy="140" r="8" fill="#88CCF1" opacity="0.8"/>
  <circle cx="256" cy="180" r="6" fill="#4A9FD8" opacity="0.8"/>
  <circle cx="180" cy="220" r="6" fill="#88CCF1" opacity="0.8"/>
  <circle cx="332" cy="220" r="6" fill="#88CCF1" opacity="0.8"/>

  <!-- Sparkles/stars for energy -->
  <g fill="url(#blueGrad)">
    <path d="M 350,100 L 360,110 L 370,100 L 360,90 Z" opacity="0.9"/>
    <path d="M 380,130 L 386,136 L 392,130 L 386,124 Z" opacity="0.8"/>
  </g>

  <!-- Main "hf" letters in orange gradient -->
  <g fill="url(#orangeGrad)">
    <!-- h -->
    <path d="M 100,160 L 100,400 L 140,400 L 140,320 L 180,320 L 180,400 L 220,400 L 220,280 Q 220,240 180,240 L 140,240 L 140,160 Z M 140,280 L 180,280 L 180,320 L 140,320 Z"/>

    <!-- f -->
    <path d="M 280,200 L 280,240 L 250,240 L 250,280 L 280,280 L 280,400 L 320,400 L 320,280 L 370,280 L 370,240 L 320,240 L 320,200 Q 320,180 340,180 L 370,180 L 370,140 L 340,140 Q 280,140 280,200 Z"/>
  </g>

  <!-- Circuit continuation from letters -->
  <g opacity="0.3" stroke="#FF9900" stroke-width="4" fill="none">
    <path d="M 220,360 L 256,360 L 256,420"/>
    <path d="M 280,360 L 256,360"/>
  </g>
  <circle cx="256" cy="420" r="8" fill="#FFB84D" opacity="0.7"/>
</svg>
